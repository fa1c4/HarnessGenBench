# CKGFuzzer target build overrides for the FuzzBench valuable target set.
#
# This file contains ONLY legitimate build facts: generated-header
# directories, required packages, neutral stub destination, language,
# compiler, and timeout. It MUST NOT contain target harness source, call
# sequences, or API names extracted from the target harness.
#
# The stub_destination is the path where a neutral LLVMFuzzerTestOneInput
# boilerplate stub is placed during CodeQL database creation so the build
# does not require the native target harness body.

targets:
  bloaty_fuzz_target:
    language: c++
    compiler: clang++
    stub_destination: src/fuzz_target.cc
    generated_headers: [build]
    timeout: 1800

  curl_curl_fuzzer_http:
    language: c++
    compiler: clang++
    stub_destination: ossfuzz/curl_fuzzer_http.cc
    generated_headers: [include]
    timeout: 1800

  freetype2_ftfuzzer:
    language: c++
    compiler: clang++
    stub_destination: fttester.cc
    generated_headers: [objs]
    timeout: 1800

  harfbuzz_hb-shape-fuzzer:
    language: c++
    compiler: clang++
    stub_destination: test/fuzzing/hb-shape-fuzzer.cc
    generated_headers: [src]
    timeout: 1800

  jsoncpp_jsoncpp_fuzzer:

# OSS-Fuzz-Gen target overrides for HarnessGenBench.
#
# This file records ONLY legitimate integration facts: project/language
# mapping, source/build dependencies, generated-source steps, Introspector
# overlay details, exact candidate destination, and build/fuzz timeouts.
# It must NEVER contain reference-derived API names or harness snippets.
# Reference harnesses are evaluator-only in blind-project.
#
# Language defaults to c++ for C++ projects and c for C projects. The
# candidate_destination is the exact native harness path inside the OSS-Fuzz
# project build context that the independent evaluator overlays each
# candidate onto. build_timeout/fuzz_timeout are per-target seconds.

targets:
  jsoncpp_jsoncpp_fuzzer:
    language: c++
    candidate_destination: /src/jsoncpp/jsoncpp_fuzzer.cc
    build_timeout: 1800
    fuzz_timeout: 600
  libxml2_xml:
    language: c
    candidate_destination: /src/libxml2/xml.c
    build_timeout: 1800
    fuzz_timeout: 600
  libpng_libpng_read_fuzzer:
    language: c
    candidate_destination: /src/libpng/libpng_read_fuzzer.c
    build_timeout: 1800
    fuzz_timeout: 600
  sqlite3_ossfuzz:
    language: c
    candidate_destination: /src/sqlite3/ossfuzz.c
    build_timeout: 1800
    fuzz_timeout: 600
    # Public documented SQLite C API (not reference-derived): internal
    # struct-heavy functions (Expr/Parse) are unusable by generated harnesses.
    preferred_apis: [sqlite3_open, sqlite3_open_v2, sqlite3_prepare_v2, sqlite3_prepare_v3, sqlite3_step, sqlite3_exec, sqlite3_finalize, sqlite3_close, sqlite3_close_v2, sqlite3_reset, sqlite3_bind_text, sqlite3_bind_blob, sqlite3_bind_int, sqlite3_column_count, sqlite3_column_text, sqlite3_column_blob, sqlite3_column_int]
  zlib_zlib_uncompress_fuzzer:
    language: c
    candidate_destination: /src/zlib/zlib_uncompress_fuzzer.c
    build_timeout: 1200
    fuzz_timeout: 600
    preferred_apis: [uncompress, uncompress2, inflateInit_, inflate, inflateEnd, compress]
  openssl_x509:
    language: c
    candidate_destination: /src/openssl/fuzz/x509.c
    build_timeout: 2400
    fuzz_timeout: 600
    preferred_apis: [X509_new, d2i_X509, X509_free, X509_verify, X509_get_subject_name, PEM_read_bio_X509]
  re2_fuzzer:
    language: c++
    candidate_destination: /src/re2/fuzzer.cc
    build_timeout: 1800
    fuzz_timeout: 600
  freetype2_ftfuzzer:
    language: c
    candidate_destination: /src/freetype2/ftfuzzer.cc
    build_timeout: 3600
    fuzz_timeout: 600
  curl_curl_fuzzer_http:
    language: c
    candidate_destination: /src/curl/curl_fuzzer_http.cc
    build_timeout: 2400
    fuzz_timeout: 600
  harfbuzz_hb-shape-fuzzer:
    language: c++
    candidate_destination: /src/harfbuzz/hb-shape-fuzzer.cc
    build_timeout: 1800
    fuzz_timeout: 600
  lcms_cms_transform_fuzzer:
    language: c
    candidate_destination: /src/lcms/cms_transform_fuzzer.c
    build_timeout: 1800
    fuzz_timeout: 600
  libjpeg-turbo_libjpeg_turbo_fuzzer:
    language: c
    candidate_destination: /src/libjpeg-turbo/libjpeg_turbo_fuzzer.cc
    build_timeout: 1800
    fuzz_timeout: 600
    preferred_apis: [tjInitDecompress, tjDecompressHeader3, tjDecompress2, jpeg_read_header, jpeg_start_decompress]
  libpcap_fuzz_both:
    language: c
    candidate_destination: /src/libpcap/fuzz_both.c
    build_timeout: 1800
    fuzz_timeout: 600
    preferred_apis: [pcap_open_dead, pcap_compile, pcap_loop, pcap_dispatch, pcap_datalink, pcap_next_ex]
  libxslt_xpath:
    language: c
    candidate_destination: /src/libxslt/xpath.c
    build_timeout: 1800
    fuzz_timeout: 600
  mbedtls_fuzz_dtlsclient:
    language: c
    candidate_destination: /src/mbedtls/programs/fuzz/fuzz_dtlsclient.c
    build_timeout: 2400
    fuzz_timeout: 600
  mruby_mruby_fuzzer_8c8bbd:
    language: c
    candidate_destination: /src/mruby/mruby_fuzzer.c
    build_timeout: 1800
    fuzz_timeout: 600
  openh264_decoder_fuzzer:
    language: c++
    candidate_destination: /src/openh264/decoder_fuzzer.cpp
    build_timeout: 2400
    fuzz_timeout: 600
  php_php-fuzz-parser_0dbedb:
    language: c
    candidate_destination: /src/php-src/sapi/fuzzer/fuzzer-parser.c
    build_timeout: 3000
    fuzz_timeout: 600
    preferred_apis: [zend_eval_string, php_json_decode_ex, zend_string_init]
  systemd_fuzz-link-parser:
    language: c
    candidate_destination: /src/systemd/src/udev/net/fuzz-link-parser.c
    build_timeout: 2400
    fuzz_timeout: 600
    preferred_apis: [link_load_one, link_config_ctx_new]
  bloaty_fuzz_target:
    language: c++
    candidate_destination: /src/bloaty/tests/fuzz_target.cc
    build_timeout: 2400
    fuzz_timeout: 600
    preferred_apis: ["bloaty::ParseOptions"]

  # -------------------------------------------------------------------------
  # MAGMA phase targets.  Only integration facts: language, build timeout and
  # the committed entry API from results/magma_harness_apis.md (a public API
  # name, never a reference-harness excerpt).  candidate_destination is left
  # empty on purpose: OSS-Fuzz-Gen resolves the native compile path from the
  # pinned OSS-Fuzz project recipe, and the HGB evaluator uses the split
  # package's evaluator manifest for the MAGMA-native overlay.
  # -------------------------------------------------------------------------
  magma_libpng:
    candidate_destination: /src/libpng/contrib/oss-fuzz/libpng_read_fuzzer.cc
    language: c
    build_timeout: 1800
    fuzz_timeout: 600
    preferred_apis: [png_create_read_struct]

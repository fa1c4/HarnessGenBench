    preferred_apis: [d2i_X509]
  magma_php:
    candidate_destination: /src/php-src/sapi/fuzzer/fuzzer-parser.c
    language: c
    build_timeout: 3600
    fuzz_timeout: 600
    preferred_apis: [zend_compile_file, zend_eval_string, php_json_decode_ex]
  magma_poppler:
    candidate_destination: /src/poppler/test/ossfuzz/pdf_fuzzer.cc
    language: c++
    build_timeout: 3600
    fuzz_timeout: 600
    preferred_apis: [load_from_raw_data]
  magma_sqlite3:
    candidate_destination: /src/sqlite3/test/ossfuzz.c
    language: c
    build_timeout: 1800
    fuzz_timeout: 600
    preferred_apis: [sqlite3_exec]

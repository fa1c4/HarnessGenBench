schema_version: 1
baselines:
  - name: oss-fuzz-gen
    task_family: harness_generator
    profiles: [alpha, paper-faithful, compat-smoke]
    default_profile: alpha
    default_protocol: blind-project
    strict_success_status: evaluated
    notes: >
      OSS-Fuzz-Gen is a harness generator. alpha and paper-faithful require a
      real Fuzz Introspector build (all_functions.json/calltree.json/
      type_info.json/report_manifest.json), a target-aware benchmark YAML
      synthesized from that introspector output, real coverage, automatic
      compile/build repair, and an independent exact-FuzzBench evaluator that
      overlays each candidate, replays the native build, runs sanitizer smoke,
      API reachability, a fixed-budget campaign, and real coverage. The local
      introspector shim, OFG_SKIP_COVERAGE_GAINS=1, empty coverage shims,
      no-op processes, tiny 1/1/1 budgets, reference-harness examples, and
      reference-derived API ranking are forbidden in alpha and paper-faithful.
      Missing benchmark YAML must synthesize or fail; it is never a soft skip.
      The OSS-Fuzz checkout is pinned and immutable; cloning floating master is
      forbidden. compat-smoke may use the local shim, 1/1/1 budgets, and
      coverage skip but must set excluded_from_aggregate=true and is never the
      default. Exact FuzzBench reference harnesses are evaluator-only and must
      never reach the generator in blind-project. Only status=evaluated counts
      as a successful alpha matrix row.
  - name: g2fuzz
    task_family: input_generator
    profiles: [alpha, paper-faithful, extension, compat-smoke]
    default_profile: alpha
    default_protocol: paper-native
    strict_success_status: evaluated
    notes: >
      G2Fuzz generates input generators and seeds for a fixed native target pair
      and is not a harness generator. alpha and paper-faithful auto-build the
      .afl (default AFL++ instrumentation) and .cmp (CmpLog) binaries from the
      pinned FuzzBench target with the modified afl-clang-fast; no externally
      prebuilt pair is required (G2FUZZ_TARGET_DIR is an optional override
      only). The native FuzzBench harness is kept unchanged. The pipeline
      validates the per-target input contract (file/stdin/argv from the adapter
      manifest, never a global @@ assumption), runs program_gen.py with an
      adapter-derived program_to_format mapping, counts only real
      generator-produced inputs (excluding .py/.json/logs/preseed/common
      corpus), requires at least one valid G2-generated input, runs the
      modified AFL++ campaign with -c target.cmp -k <G2FUZZ> requiring
      execs_done>0 and a nonempty queue, and collects real LLVM/lcov coverage
      (AFL paths_total is never edge coverage; edge_coverage is unavailable
      when no edge report exists). status=evaluated requires
      target_pair_build.status==completed, valid_g2_generated_count>0,
      campaign.execs_done>0, campaign.queue_count>0, and a real coverage report
      with non-null covered lines. A failed/missing pair build is
      infra_failure/infra_missing, never a soft skip; all generated inputs
      failing validation is quality_failure. paper-faithful and extension
      method_profile groups are reported separately by the matrix collector.
  - name: elfuzz
    task_family: input_generator
    profiles: [alpha, paper-faithful, compat-smoke]
    default_profile: alpha
    default_protocol: paper-native
    strict_success_status: evaluated
    notes: ELFuzz synthesizes and evolves input-producing fuzzer programs against a fixed native FuzzBench target, then runs a final AFL++ campaign. It is an input generator, not a harness generator, and supports only the explicit text-input target set in metadata/elfuzz_target_adapters.yaml. Non-text targets are contractually Invalid (not_applicable) and must not start Docker/model download, TGI, synthesis, or fuzzing. alpha and paper-faithful build and verify the exact /out/<fuzz_target> (rejecting build.sh), load and validate the per-target adapter.yaml (no jsoncpp/libxml2 aliasing for extension targets), run the coverage-guided evolution loop (>= 2 iterations; one-iteration smoke is compat-smoke only), validate generated inputs against the exact target (valid_count > 0), run a campaign with execs_done > 0, and collect real coverage (LLVM report when ELFUZZ_COVERAGE_REPLAY=1; AFL paths_total is never edge coverage). status=evaluated requires a coverage report path, nonzero executions, and all goal stages completed. Invalid rows are excluded from the success/failure denominator and coverage aggregates.
  - name: promefuzz
    task_family: harness_generator
    profiles: [alpha, paper-faithful, compat-smoke]
    default_profile: alpha
    default_protocol: blind-project
    strict_success_status: evaluated
    notes: >
      PromeFuzz is a harness generator. alpha and paper-faithful require a real
      compile database captured from the pinned FuzzBench build (never a
      synthetic one), real link/library context with non-empty
      driver_build_args, legitimate consumer knowledge when available, a real
      semantic embedding provider (never mock/hash), the official ALL-COVER
      generation path with practical multi-candidate budgets, iterative native
      target build validation against the exact pinned FuzzBench build, and the
      common harness evaluator (build + sanitizer smoke + API reachability +
      fixed-budget campaign + coverage). Synthetic compile databases, hash/mock
      embeddings, selected-reference-harness API filtering, empty
      driver_build_args, and method-changing fallbacks are forbidden in alpha
      and paper-faithful; a missing real build context is a concrete failure,
      not a soft skip. compat-smoke may use the synthetic compile database and
      local hash embeddings for offline wiring tests only, must set
      excluded_from_aggregate=true and method_variant=compat-smoke, and is never
      selected by default. Exact FuzzBench reference harnesses are
      evaluator-only and must never reach the PromeFuzz generator in
      blind-project. Only status=evaluated counts as a successful alpha matrix
      row.
  - name: ckgfuzzer
    task_family: harness_generator
    profiles: [alpha, paper-faithful, compat-smoke]
    default_profile: alpha
    default_protocol: blind-project
    strict_success_status: evaluated
    allowed_statuses: [evaluated, quality_failure, infra_failure, not_applicable, compat_smoke_completed]
    notes: >
      CKGFuzzer is a harness generator. alpha and paper-faithful require a real
      CodeQL database built from the exact FuzzBench target build context, a
      real embedding service, upstream LLM API summaries, the upstream
      API-combination planner, and the upstream compilation-check/repair loop.
      Mock/hash embeddings, local deterministic API summaries, local
      deterministic API combinations, source-only graph fallback, and
      --skip_check_compilation are forbidden in alpha and paper-faithful. A
      failed or empty CodeQL graph is a hard failure
      (failed_stage=codeql_context), not a successful source fallback. The
      target package is physically split into generator_input (mounted at
      /target for the blind generator, with no reference-harness fields in its
      manifest) and evaluator_only (mounted at /evaluator for the independent
      harness evaluator). The harness evaluator overlays each candidate at the
      exact native FuzzBench harness path, runs sanitizer smoke, API
      reachability, a fixed-budget libFuzzer campaign (execs_done > 0), and
      real LLVM source-based coverage; a candidate that merely compiles never
      marks campaign or coverage completed. status=evaluated requires a real
      overlay, per-candidate evaluator JSON, execs_done > 0, and a real
      coverage report. quality_failure means generation ran but no candidate
      passed the full loop; infra_failure means tooling failed. compat-smoke
      may retain deterministic/mock fallbacks but must set
      excluded_from_aggregate=true and is never selected by default. Exact
      FuzzBench reference harnesses are evaluator-only and must never reach the
      generator in blind-project. Only status=evaluated counts as a successful
      alpha matrix row.

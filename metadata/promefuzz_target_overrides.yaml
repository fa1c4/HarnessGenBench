# PromeFuzz target build overrides for the FuzzBench valuable target set.
#
# This file contains ONLY legitimate build facts: language/standard, required
# generated-source step, compile DB capture method, library output glob, exact
# candidate destination, and build/generation timeouts. It MUST NOT contain
# target harness source, reference-derived API names, call sequences, or
# snippets extracted from the target harness. Exact FuzzBench reference
# harnesses are evaluator-only in blind-project.
#
# candidate_destination is the exact native harness path inside the FuzzBench
# project build context that the independent evaluator overlays each PromeFuzz
# candidate onto. compile_db_capture_method selects the real capture strategy
# (bear_replay replays build.sh under bear; cmake_export uses
# -DCMAKE_EXPORT_COMPILE_COMMANDS). library_output_glob is where the build
# produces archives/shared libraries for link-context recovery.

targets:
  bloaty_fuzz_target:
    language: c++
    candidate_destination: /src/fuzz_target.cc
    compile_db_capture_method: bear_replay
    library_output_glob: [build, src/libbloaty.a]
    build_timeout: 2400
    generation_timeout: 7200

  curl_curl_fuzzer_http:
    language: c++
    candidate_destination: /src/curl_fuzzer_http.cc

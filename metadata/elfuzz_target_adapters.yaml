schema_version: 1
generator: elfuzz
task_family: input_generator
default_profile: alpha
default_protocol: paper-native
# Explicit, committed adapter contract for the ELFuzz alpha integration.
# Applicability is decided from this manifest only; runtime filename substrings
# and permissive environment overrides (ELFUZZ_TRUST_FUZZBENCH_TARGET etc.) do
# not bypass it in alpha/paper profiles. ELFuzz evolves input-producing fuzzer
# programs for text-input targets; non-text targets are contractually Invalid.
targets:
  - target: curl_curl_fuzzer_http
    applicability: applicable
    input_kind: text
    upstream_benchmark: curl
    adapter_class: extension
    hgb_adapter: true
    adapter_id: curl_http
    build_mode: fuzzbench_native
    input_mode: file
    argv: ["@@"]
    format: HTTP response text
    format_spec: repro/elfuzz/targets/curl_curl_fuzzer_http/format.md
    adapter_dir: repro/elfuzz/targets/curl_curl_fuzzer_http
    seed_template: repro/elfuzz/targets/curl_curl_fuzzer_http/seed_fuzzer.py
    elfuzz_adapter_dir: repro/elfuzz/targets/curl_curl_fuzzer_http
    argv_template: ["@@"]
    seed_templates: ["repro/elfuzz/targets/curl_curl_fuzzer_http/seed_fuzzer.py"]
    run_command: "/out/<fuzz_target> @@"
    coverage_command: "LLVM_PROFILE_FILE=$COV_PROFRAW /out/<fuzz_target> -runs=0 $CORPUS_DIR"
    validity_check: http_response
    timeout_seconds: 5
